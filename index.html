<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ways</title>

    <!-- Novos caminhos de Ícones (Pasta /Icons/) -->
    <link rel="icon" type="image/png" href="Icons/Favicon.png">
    <link rel="apple-touch-icon" href="Icons/Icon512.png">
    <link rel="manifest" href="manifest.json">
    
    <meta name="theme-color" content="#86198f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- BASE E RESET --- */
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #86198f; /* Fundo base Fúcsia */
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        /* --- IFRAME WRAPPER (Camada 0 - O Sistema) --- */
        #iframe-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            -webkit-overflow-scrolling: touch; 
        }
        #app-frame { border: none; width: 100%; height: 100%; display: block; background-color: #f8fafc; }

        /* --- SPLASH SCREEN (Camada 10 - Animação de Entrada) --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            background-color: #86198f;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
            overflow: hidden;
        }

        /* --- HOLOFOTES VOLUMÉTRICOS (Baseado no seu código) --- */
        .spotlight {
            position: absolute;
            width: 250vw;
            height: 250vh;
            pointer-events: none;
            mix-blend-mode: screen; /* Adiciona brilho ao cruzar com o fúcsia base */
            opacity: 0;
            animation: fadeInSpots 1.5s ease forwards;
        }

        /* Luz 1: Fúcsia Neon Claro (Inferior Esquerda) */
        .spot-1 {
            left: -50%; bottom: -50%;
            background: conic-gradient(from 15deg at 20% 80%, transparent 0deg, rgba(232, 121, 249, 0.6) 4deg, transparent 15deg);
            filter: blur(35px);
            transform-origin: 20% 80%;
            animation: spot1Lantern 10s infinite alternate ease-in-out, fadeInSpots 1.5s ease forwards;
        }

        /* Luz 2: Branco Cristalino (Inferior Direita) */
        .spot-2 {
            right: -50%; bottom: -50%;
            background: conic-gradient(from -15deg at 80% 80%, transparent 0deg, rgba(255, 255, 255, 0.4) 4deg, transparent 15deg);
            filter: blur(30px);
            transform-origin: 80% 80%;
            animation: spot2Lantern 9s infinite alternate-reverse ease-in-out, fadeInSpots 1.5s ease forwards;
        }

        /* Luz 3: Branco Intenso (Superior Esquerda) */
        .spot-3 {
            left: -50%; top: -50%;
            background: conic-gradient(from 160deg at 20% 20%, transparent 0deg, rgba(255, 255, 255, 0.3) 6deg, transparent 40deg);
            filter: blur(40px);
            transform-origin: 20% 20%;
            animation: spot3Lantern 14s infinite alternate ease-in-out, fadeInSpots 1.5s ease forwards;
        }

        /* Luz 4: Roxo Profundo/Neon (Superior Direita) */
        .spot-4 {
            right: -50%; top: -50%;
            background: conic-gradient(from 180deg at 80% 20%, transparent 0deg, rgba(192, 38, 211, 0.8) 6deg, transparent 40deg);
            filter: blur(50px);
            transform-origin: 80% 20%;
            animation: spot4Lantern 18s infinite alternate-reverse ease-in-out, fadeInSpots 1.5s ease forwards;
        }

        @keyframes fadeInSpots { to { opacity: 0.85; } }
        @keyframes spot1Lantern { 0% { transform: rotate(0deg); } 100% { transform: rotate(35deg); } }
        @keyframes spot2Lantern { 0% { transform: rotate(0deg); } 100% { transform: rotate(-35deg); } }
        @keyframes spot3Lantern { 0% { transform: rotate(0deg); } 100% { transform: rotate(-25deg); } }
        @keyframes spot4Lantern { 0% { transform: rotate(0deg); } 100% { transform: rotate(25deg); } }

        /* Card Central Glassmorphism */
        .glass-card {
            z-index: 5; display: flex; flex-direction: column; align-items: center;
            background: rgba(255, 255, 255, 0.08); /* Um pouco mais transparente para a luz passar */
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 40px; padding: 40px 60px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15), inset 0 0 20px rgba(255,255,255,0.05);
            animation: float 4s ease-in-out infinite;
        }

        .brand-text {
            font-family: 'Dancing Script', cursive; color: white;
            font-size: 6.5rem; line-height: 1;
            text-shadow: 0 10px 25px rgba(0,0,0,0.3);
            letter-spacing: 2px; margin-bottom: 10px;
        }

        /* Loading elegante estilo iOS */
        .loading-dots { display: flex; gap: 8px; justify-content: center; }
        .dot { width: 8px; height: 8px; background: white; border-radius: 50%; opacity: 0.5; animation: dotPulse 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        /* Rodapé Intocado */
        .footer-container { position: absolute; bottom: 35px; display: flex; flex-direction: column; align-items: center; z-index: 5; opacity: 0.8; }
        .footer-logo { width: 90px; margin-bottom: 8px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3)); }
        .powered-by { font-size: 0.75rem; color: rgba(255, 255, 255, 0.8); font-weight: 300; }

        /* --- MODO OFFLINE (Camada 20) --- */
        #offline-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20;
            background: rgba(60, 60, 60, 0.85);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.4s ease; text-align: center; color: white;
        }
        .offline-icon { font-size: 4rem; margin-bottom: 15px; opacity: 0.9; }
        .offline-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 10px; letter-spacing: 1px; }
        .offline-subtitle { font-size: 0.95rem; font-weight: 300; margin-bottom: 35px; max-width: 260px; opacity: 0.8; line-height: 1.4; }
        .retry-btn {
            background: white; color: #333; border: none; padding: 16px 45px; border-radius: 50px;
            font-weight: 700; font-size: 1rem; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            transition: transform 0.1s;
        }
        .retry-btn:active { transform: scale(0.95); }

        /* --- ANIMAÇÕES KEYFRAMES --- */
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-12px); } 100% { transform: translateY(0px); } }
        @keyframes dotPulse { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <!-- 1. O SISTEMA (Carrega no fundo) -->
    <div id="iframe-wrapper">
        <iframe 
            id="app-frame" 
            src="" 
            allow="geolocation https://script.google.com https://*.googleusercontent.com; microphone; camera"
            sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-modals">
        </iframe>
    </div>

    <!-- 2. ANIMAÇÃO DE ENTRADA CINEMATOGRÁFICA -->
    <div id="splash-screen">
        
        <!-- Holofotes Volumétricos -->
        <div class="spotlight spot-1"></div>
        <div class="spotlight spot-2"></div>
        <div class="spotlight spot-3"></div>
        <div class="spotlight spot-4"></div>
        
        <!-- Camada Central Glassmorphism -->
        <div class="glass-card">
            <div class="brand-text">Ways</div>
            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div class="footer-container">
            <img src="MesaLogo.png" class="footer-logo" alt="Logotipo Mesaque">
            <div class="powered-by">
                Powered with <span style="color: #FFFFFF;">&#10084;</span> by <strong>Mesaque</strong>
            </div>
        </div>
    </div>

    <!-- 3. MODO OFFLINE -->
    <div id="offline-screen">
        <div class="offline-icon">📡</div>
        <div class="offline-title">Sem Conexão</div>
        <div class="offline-subtitle">Parece que você está offline. Verifique sua internet para acessar o Ways.</div>
        <button class="retry-btn" onclick="checkConnection()">Tentar Novamente</button>
    </div>

    <!-- SCRIPT DE CONTROLE -->
    <script>
        // A Nova URL do GAS
        const WAYS_URL = "https://script.google.com/macros/s/AKfycbwi4RmZ6iaQCD5na0sTdizsKnn_ivhZ5xZJ3FazWRfIpe5_4FhjmpHvbuOBMVXRW4Cw/exec";
        
        // 1. Injeta a URL no iframe imediatamente ao abrir o app
        document.getElementById('app-frame').src = WAYS_URL;

        // 2. Controla o tempo de tela do Splash Screen (Exatos 3 segundos)
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                
                // Aguarda a transição de opacidade acabar para sumir com a div
                setTimeout(() => {
                    splash.style.visibility = 'hidden';
                    splash.style.display = 'none';
                }, 600);
            }, 3000);
        });

        // 3. Controle Inteligente do Modo Offline
        const offlineScreen = document.getElementById('offline-screen');

        function showOffline() {
            offlineScreen.style.display = 'flex';
            void offlineScreen.offsetWidth; // Força renderização visual (reflow)
            offlineScreen.style.opacity = '1';
        }

        function hideOffline() {
            offlineScreen.style.opacity = '0';
            setTimeout(() => {
                if (navigator.onLine) offlineScreen.style.display = 'none';
            }, 400);
        }

        function checkConnection() {
            const btn = document.querySelector('.retry-btn');
            if (navigator.onLine) {
                hideOffline();
                // Opcional: Recarrega o app se a pessoa perdeu a conexão antes do iframe carregar
                if (!document.getElementById('app-frame').contentWindow) {
                    document.getElementById('app-frame').src = WAYS_URL;
                }
            } else {
                btn.innerText = 'Verificando...';
                setTimeout(() => { btn.innerText = 'Tentar Novamente'; }, 800);
            }
        }

        window.addEventListener('offline', showOffline);
        window.addEventListener('online', hideOffline);

        // Se abrir o App já sem internet, mostra o aviso na hora
        if (!navigator.onLine) { showOffline(); }

        // 4. Fix nativo para evitar tela branca no mobile (Volta de hibernação)
        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === "visible") {
                const frame = document.getElementById('app-frame');
                frame.style.display = 'none';
                void frame.offsetHeight; 
                frame.style.display = 'block';
            }
        });

        // 5. Registra o Service Worker (PWA)
        if ('serviceWorker' in navigator) { 
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log("Ways PWA Ativo."))
                .catch(err => console.error("Falha no SW:", err));
        }
    </script>
</body>
</html>
