<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ways</title>

    <link rel="icon" type="image/png" href="Favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="theme-color" content="#6105e8">

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pulltorefreshjs/0.1.22/pulltorefresh.min.js"></script>

    <style>
        /* Base */
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #6105e8;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        /* --- CAMADA DE FUNDO ANIMADA OTIMIZADA (CYBERPUNK HIGHWAY) --- */
        #bg-animation-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            overflow: hidden; pointer-events: none;
            background-color: #5504cd;
            transition: opacity 0.8s ease;
        }

        .neon-truck {
            position: absolute;
            height: auto;
            will-change: transform;
            transform: translateZ(0); 
            opacity: 0; 
        }

        .truck-white { fill: #FFFFFF; filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8)); }
        .truck-cyan  { fill: #00FFFF; filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.7)); }
        .truck-pink  { fill: #FF00FF; filter: drop-shadow(0 0 10px rgba(255, 0, 255, 0.7)); }

        @keyframes driveRightDynamic {
            0%   { left: -25%; opacity: 0; }
            5%   { opacity: var(--truck-opacity); }
            90%  { opacity: var(--truck-opacity); }
            100% { left: 115%; opacity: 0; transform: scaleX(1); }
        }

        @keyframes driveLeftDynamic {
            0%   { left: 115%; opacity: 0; }
            5%   { opacity: var(--truck-opacity); }
            90%  { opacity: var(--truck-opacity); }
            100% { left: -25%; opacity: 0; transform: scaleX(-1); }
        }

        .neon-truck:nth-child(5n+1) { --truck-opacity: 0.3; width: 25px; top: 10%; animation: driveRightDynamic 22s ease-in-out infinite; animation-delay: 1s; }
        .neon-truck:nth-child(5n+2) { --truck-opacity: 0.5; width: 35px; top: 25%; animation: driveLeftDynamic 18s ease-in-out infinite; animation-delay: 5s; }
        .neon-truck:nth-child(5n+3) { --truck-opacity: 0.6; width: 50px; top: 50%; animation: driveRightDynamic 14s ease-in-out infinite; animation-delay: 3s; }
        .neon-truck:nth-child(5n+4) { --truck-opacity: 0.8; width: 70px; top: 75%; animation: driveLeftDynamic 9s ease-in infinite; animation-delay: 0s; }
        .neon-truck:nth-child(5n+5) { --truck-opacity: 0.9; width: 100px; top: 88%; animation: driveRightDynamic 6s linear infinite; animation-delay: 2s; }

        /* --- CAMADA DE VIDRO FOSCO OTIMIZADA --- */
        #glass-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            background: rgba(97, 5, 232, 0.15); 
            pointer-events: none;
            transition: opacity 0.8s ease, background 0.3s ease;
        }

        /* --- INTERFACE --- */
        #selection-screen, #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; 
            align-items: center;
            z-index: 9999; 
            transition: opacity 0.8s ease, visibility 0.8s ease;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .header-section {
            margin-top: 4vh; text-align: center; margin-bottom: 40px;
            animation: slideDown 0.8s ease-out;
        }
        .welcome-text { color: white; font-size: 1.1rem; opacity: 0.9; font-weight: 300; letter-spacing: 1px; }
        .brand-text { 
            font-family: 'Dancing Script', cursive; 
            color: white; font-size: 6rem; line-height: 1; margin-top: 5px;
            text-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .custom-dropdown-container {
            position: relative; width: 100%; max-width: 320px; margin-bottom: 25px; z-index: 100;
        }
        .dropdown-trigger {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 18px; padding: 18px 25px;
            color: white; font-size: 1rem; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .dropdown-trigger:active { background: rgba(255,255,255,0.25); }
        .dropdown-arrow { transition: transform 0.3s; font-size: 0.8rem; }
        .dropdown-trigger.active .dropdown-arrow { transform: rotate(180deg); }

        .dropdown-options {
            position: absolute; top: 110%; left: 0; width: 100%;
            background: rgba(40, 10, 90, 0.9); backdrop-filter: blur(20px);
            border-radius: 18px; border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden; display: none; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); animation: fadeInDrop 0.2s ease-out;
        }
        .dropdown-option {
            padding: 15px 25px; color: white; border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer; transition: background 0.2s;
        }
        .dropdown-option:last-child { border-bottom: none; }
        .dropdown-option:active { background: rgba(255,255,255,0.2); }

        #post-selection { display: none; flex-direction: column; align-items: center; width: 100%; animation: fadeIn 0.5s ease-out forwards; }
        .remember-container { display: flex; align-items: center; color: white; font-size: 0.9rem; margin-bottom: 30px; cursor: pointer; padding: 10px; opacity: 0.9; }
        .checkbox-ui { width: 20px; height: 20px; border: 2px solid white; border-radius: 6px; margin-right: 12px; position: relative; transition: all 0.2s; }
        input:checked + .checkbox-ui { background: white; }
        input:checked + .checkbox-ui::after { content: '✓'; color: #6105e8; position: absolute; font-size: 14px; top: -2px; left: 3px; font-weight: bold; }

        .enter-btn {
            background-color: white; color: #6105e8; border: none; padding: 16px 70px;
            border-radius: 50px; font-weight: 700; font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25); transition: transform 0.1s;
        }
        .enter-btn:active { transform: scale(0.95); }

        .footer-container { margin-top: auto; display: flex; flex-direction: column; align-items: center; opacity: 0.8; animation: fadeIn 1s 1s forwards; }
        .footer-logo { width: 90px; margin-bottom: 10px; }
        .powered-by { font-size: 0.75rem; color: rgba(255, 255, 255, 0.7); font-weight: 300; }

        /* --- COMPONENTE: SEMÁFORO DE CARREGAMENTO --- */
        #loading-screen { justify-content: center; z-index: 10000; }
        .loading-center { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; }
        
        #traffic-light {
            background: #111; border-radius: 40px; padding: 20px 15px;
            display: flex; flex-direction: column; gap: 15px; border: 2px solid #2a2a2a;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 15px rgba(0,0,0,0.9);
            position: relative; margin-bottom: 30px; z-index: 10001;
        }

        .light {
            width: 60px; height: 60px; border-radius: 50%; background: #222; 
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.6);
            transition: background 0.2s ease, box-shadow 0.2s ease; position: relative;
        }

        .light.red.active { background: #ff3333; box-shadow: 0 0 40px #ff3333, inset 0 0 15px rgba(255,255,255,0.6); }
        .light.yellow.active { background: #ffcc00; box-shadow: 0 0 40px #ffcc00, inset 0 0 15px rgba(255,255,255,0.6); }
        .light.green.active { background: #00ff00; box-shadow: 0 0 40px #00ff00, inset 0 0 15px rgba(255,255,255,0.6); }

        #go-text {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.3);
            color: #ffffff; font-weight: 900; font-size: 1.8rem;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8); opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10; pointer-events: none;
        }

        #go-text.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }

        .switch-unit-btn {
            margin-top: auto; margin-bottom: 20px; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2); padding: 12px 25px; border-radius: 30px;
            color: white; font-size: 0.9rem; backdrop-filter: blur(5px); cursor: pointer;
        }

        /* --- CONTROLE DE ESTADOS GLOBAIS VIA JS --- */
        #bg-animation-layer.is-stopped .neon-truck { animation-play-state: paused !important; }

        @keyframes warningPulse {
            0% { background: rgba(255, 165, 0, 0.05); }
            100% { background: rgba(255, 165, 0, 0.25); }
        }
        .glass-warning-pulse { animation: warningPulse 0.4s infinite alternate !important; }

        /* --- IFRAME WRAPPER (Fix para rolagem no iOS/Android) --- */
        #iframe-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; 
            z-index: 0;
        }

        #app-frame { border: none; width: 100%; height: 100%; display: block; }
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8);
            z-index: 20000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        .modal-box { background: white; padding: 30px; border-radius: 25px; text-align: center; width: 80%; max-width: 300px; }

        @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInDrop { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="iframe-wrapper">
        <iframe 
         id="app-frame" 
         src="" 
         allow="geolocation https://script.google.com https://*.googleusercontent.com; microphone; camera"
         sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-modals"
        ></iframe>
    </div>

    <div id="bg-animation-layer">
        <svg class="neon-truck truck-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512"><path d="M48 0C21.5 0 0 21.5 0 48V368c0 26.5 21.5 48 48 48H64c0 53 43 96 96 96s96-43 96-96H384c0 53 43 96 96 96s96-43 96-96h32c17.7 0 32-14.3 32-32s-14.3-32-32-32V288 256 237.3c0-17-6.7-33.3-18.7-45.3L512 114.7c-12-12-28.3-18.7-45.3-18.7H416V48c0-26.5-21.5-48-48-48H48zM416 160h50.7L544 237.3V256H416V160zM112 416a48 48 0 1 1 96 0 48 48 0 1 1 -96 0zm368-48a48 48 0 1 1 0 96 48 48 0 1 1 0-96z"/></svg>
        <svg class="neon-truck truck-cyan" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512"><path d="M48 0C21.5 0 0 21.5 0 48V368c0 26.5 21.5 48 48 48H64c0 53 43 96 96 96s96-43 96-96H384c0 53 43 96 96 96s96-43 96-96h32c17.7 0 32-14.3 32-32s-14.3-32-32-32V288 256 237.3c0-17-6.7-33.3-18.7-45.3L512 114.7c-12-12-28.3-18.7-45.3-18.7H416V48c0-26.5-21.5-48-48-48H48zM416 160h50.7L544 237.3V256H416V160zM112 416a48 48 0 1 1 96 0 48 48 0 1 1 -96 0zm368-48a48 48 0 1 1 0 96 48 48 0 1 1 0-96z"/></svg>
        <svg class="neon-truck truck-pink" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512"><path d="M48 0C21.5 0 0 21.5 0 48V368c0 26.5 21.5 48 48 48H64c0 53 43 96 96 96s96-43 96-96H384c0 53 43 96 96 96s96-43 96-96h32c17.7 0 32-14.3 32-32s-14.3-32-32-32V288 256 237.3c0-17-6.7-33.3-18.7-45.3L512 114.7c-12-12-28.3-18.7-45.3-18.7H416V48c0-26.5-21.5-48-48-48H48zM416 160h50.7L544 237.3V256H416V160zM112 416a48 48 0 1 1 96 0 48 48 0 1 1 -96 0zm368-48a48 48 0 1 1 0 96 48 48 0 1 1 0-96z"/></svg>
        <svg class="neon-truck truck-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512"><path d="M48 0C21.5 0 0 21.5 0 48V368c0 26.5 21.5 48 48 48H64c0 53 43 96 96 96s96-43 96-96H384c0 53 43 96 96 96s96-43 96-96h32c17.7 0 32-14.3 32-32s-14.3-32-32-32V288 256 237.3c0-17-6.7-33.3-18.7-45.3L512 114.7c-12-12-28.3-18.7-45.3-18.7H416V48c0-26.5-21.5-48-48-48H48zM416 160h50.7L544 237.3V256H416V160zM112 416a48 48 0 1 1 96 0 48 48 0 1 1 -96 0zm368-48a48 48 0 1 1 0 96 48 48 0 1 1 0-96z"/></svg>
        <svg class="neon-truck truck-cyan" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512"><path d="M48 0C21.5 0 0 21.5 0 48V368c0 26.5 21.5 48 48 48H64c0 53 43 96 96 96s96-43 96-96H384c0 53 43 96 96 96s96-43 96-96h32c17.7 0 32-14.3 32-32s-14.3-32-32-32V288 256 237.3c0-17-6.7-33.3-18.7-45.3L512 114.7c-12-12-28.3-18.7-45.3-18.7H416V48c0-26.5-21.5-48-48-48H48zM416 160h50.7L544 237.3V256H416V160zM112 416a48 48 0 1 1 96 0 48 48 0 1 1 -96 0zm368-48a48 48 0 1 1 0 96 48 48 0 1 1 0-96z"/></svg>
    </div>

    <div id="glass-overlay"></div>

    <div id="selection-screen">
        <div class="header-section">
            <div class="welcome-text">Bem-vindo ao</div>
            <div class="brand-text">Ways</div>
        </div>

        <div class="custom-dropdown-container">
            <div class="dropdown-trigger" onclick="toggleDropdown()">
                <span id="selected-text">Selecione sua Unidade</span>
                <span class="dropdown-arrow">▼</span>
            </div>
            <div class="dropdown-options" id="dropdown-options">
                <div class="dropdown-option" onclick="selectUnit('itaquera', 'Itaquera')">Itaquera</div>
                <div class="dropdown-option" onclick="selectUnit('carmo', 'Carmo')">Carmo</div>
                <div class="dropdown-option" onclick="selectUnit('interlagos', 'Interlagos')">Interlagos</div>
                <div class="dropdown-option" onclick="selectUnit('campolimpo', 'Campo Limpo')">Campo Limpo</div>
                <div class="dropdown-option" onclick="selectUnit('cecam', 'CECAM')">CECAM</div>
            </div>
        </div>
        <input type="hidden" id="unit-value">

        <div id="post-selection">
            <label class="remember-container">
                <input type="checkbox" id="remember-check" style="display:none">
                <div class="checkbox-ui"></div>
                Lembrar minha escolha
            </label>
            <button class="enter-btn" onclick="confirmarUnidade()">ACESSAR</button>
        </div>

        <div class="footer-container">
            <img src="MesaLogo.png" class="footer-logo">
            <div class="powered-by">
                Powered with <span style="color: #FFFFFF;">&#10084;</span> by <strong>Mesaque</strong>
            </div>
        </div>
    </div>

    <div id="loading-screen" style="display: none; opacity: 0;">
        <div class="loading-center">
            <div id="traffic-light">
                <div class="light red" id="light-red"></div>
                <div class="light yellow" id="light-yellow"></div>
                <div class="light green" id="light-green">
                    <span id="go-text">GO!</span>
                </div>
            </div>
        </div>

        <div class="switch-unit-btn" onclick="resetarEscolha()">Cancelar</div>

        <div class="footer-container" style="margin-top: 0; margin-bottom: 30px;">
            <img src="MesaLogo.png" class="footer-logo">
            <div class="powered-by">
                Powered with <span style="color: #FFFFFF;">&#10084;</span> by <strong>Mesaque</strong>
            </div>
        </div>
    </div>

    <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="color:#6105e8; margin-top:0">🚧 Em Construção</h3>
            <p id="modal-msg" style="color:#555; font-size:0.9rem; margin: 15px 0 25px 0;"></p>
            <button onclick="fecharModal()" style="background:#6105e8; color:white; border:none; padding:12px 30px; border-radius:50px; font-weight:600; cursor:pointer;">Entendi</button>
        </div>
    </div>

    <script>
        const UNIDADES = {
            itaquera: "https://script.google.com/macros/s/AKfycbyXjwXxpawmeqHm8WNUuDtjUMSts5JiBt0JhAqr8vpMpkdEEDWKQVLnSkBlznOtoXY2/exec",
            cecam: "https://script.google.com/macros/s/AKfycbyxlrK1vuSQr5XnvBbfiRBHmrfdmwXX9TVihQAKyxTD7Im2EhIzmmcmQWQABodEUIJN/exec",
            carmo: "", interlagos: "", campolimpo: ""
        };
        
        let urlAtual = "";

        function toggleDropdown() {
            const list = document.getElementById('dropdown-options');
            const trigger = document.querySelector('.dropdown-trigger');
            if (list.style.display === 'flex') { list.style.display = 'none'; trigger.classList.remove('active'); }
            else { list.style.display = 'flex'; trigger.classList.add('active'); }
        }

        function selectUnit(value, text) {
            document.getElementById('unit-value').value = value;
            document.getElementById('selected-text').innerText = text;
            toggleDropdown();
            document.getElementById('post-selection').style.display = 'flex';
        }

        window.onclick = function(event) {
            if (!event.target.matches('.dropdown-trigger') && !event.target.matches('.dropdown-trigger *')) {
                document.getElementById('dropdown-options').style.display = 'none';
                document.querySelector('.dropdown-trigger').classList.remove('active');
            }
        }

        function fecharModal() { document.getElementById('custom-modal').style.display = 'none'; }

        function confirmarUnidade() {
            const escolha = document.getElementById('unit-value').value;
            if (!escolha) return;
            if (UNIDADES[escolha] === "") {
                const text = document.getElementById('selected-text').innerText;
                document.getElementById('modal-msg').innerText = "A unidade " + text + " ainda está em construção.";
                document.getElementById('custom-modal').style.display = 'flex';
                return;
            }
            if (document.getElementById('remember-check').checked) localStorage.setItem('ways_unidade_salva', escolha);
            iniciarSistema(escolha);
        }

        function iniciarSistema(chave) {
            urlAtual = UNIDADES[chave];
            
            // 1. Ocultar Tela de Seleção suavemente
            const selScreen = document.getElementById('selection-screen');
            selScreen.style.opacity = '0';
            setTimeout(() => { selScreen.style.visibility = 'hidden'; }, 800);
            
            // 2. Preparar Tela de Loading (Semáforo)
            const loadScreen = document.getElementById('loading-screen');
            loadScreen.style.display = 'flex';
            setTimeout(() => { loadScreen.style.opacity = '1'; }, 50);

            // 3. ANTECIPAÇÃO DE CARGA (Download do iframe em background)
            document.getElementById('app-frame').src = urlAtual;

            const bgLayer = document.getElementById('bg-animation-layer');
            const glassOverlay = document.getElementById('glass-overlay');
            const lightRed = document.getElementById('light-red');
            const lightYellow = document.getElementById('light-yellow');
            const lightGreen = document.getElementById('light-green');
            const goText = document.getElementById('go-text');

            // --- FASE 1: SINAL VERMELHO ---
            setTimeout(() => {
                bgLayer.classList.add('is-stopped'); 
                lightRed.classList.add('active'); 
                glassOverlay.style.background = 'rgba(255, 0, 0, 0.15)'; 
            }, 300);

            // --- FASE 2: SINAL AMARELO ---
            setTimeout(() => {
                lightRed.classList.remove('active');
                lightYellow.classList.add('active'); 
                glassOverlay.classList.add('glass-warning-pulse'); 
            }, 1800);

            // --- FASE 3: SINAL VERDE & GO! ---
            setTimeout(() => {
                lightYellow.classList.remove('active');
                glassOverlay.classList.remove('glass-warning-pulse');
                
                lightGreen.classList.add('active'); 
                goText.classList.add('show'); 
                
                glassOverlay.style.background = 'rgba(0, 255, 0, 0.15)'; 
                bgLayer.classList.remove('is-stopped'); 
            }, 3300);

            // --- FASE 4: TRANSIÇÃO PARA O APP ---
            setTimeout(() => {
                loadScreen.style.opacity = '0'; 
                bgLayer.style.opacity = '0';
                glassOverlay.style.opacity = '0';

                setTimeout(() => { 
                    loadScreen.style.display = 'none';
                    bgLayer.style.display = 'none'; 
                    glassOverlay.style.display = 'none';
                    lightGreen.classList.remove('active');
                    goText.classList.remove('show');
                }, 800);
            }, 4500);
        }

        function resetarEscolha() {
            localStorage.removeItem('ways_unidade_salva');
            window.location.reload();
        }

        // CORREÇÃO: Repaint do Iframe para evitar tela preta no retorno do 2º plano
        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === "visible" && urlAtual) {
                const frame = document.getElementById('app-frame');
                frame.style.display = 'none';
                void frame.offsetHeight; // Força reflow
                frame.style.display = 'block';
            }
        });

        // CORREÇÃO: Interceptação do Botão Voltar do Android
        history.pushState({ appState: 'running' }, "");
        window.addEventListener('popstate', function(event) {
            history.pushState({ appState: 'running' }, ""); // Mantém o app aberto
            const frame = document.getElementById('app-frame');
            if (frame && frame.contentWindow) {
                // Envia sinal para o GAS
                frame.contentWindow.postMessage({ acao: 'botao_voltar_pressionado' }, '*');
            }
        });

        const salva = localStorage.getItem('ways_unidade_salva');
        if (salva && UNIDADES[salva]) {
            document.getElementById('selection-screen').style.display = 'none';
            iniciarSistema(salva);
        }

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
    </script>
</body>
</html>
